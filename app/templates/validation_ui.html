<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice Validation UI</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(760px, 100%);
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }
      .eyebrow {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      h1 { margin: 0 0 8px; font-size: 1.7rem; }
      p { color: #475569; line-height: 1.5; margin: 0 0 16px; }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 6px; font-weight: 600; }
      input, select, button {
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        padding: 10px 12px;
        font-size: 1rem;
      }
      input[type="file"] { background: #f8fafc; color: #0f172a; }
      button {
        cursor: pointer;
        background: #2563eb;
        color: white;
        border: none;
        font-weight: 700;
      }
      button:hover { background: #1d4ed8; }
      .status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        white-space: pre-wrap;
        overflow: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">UAE Compliance Validation Engine</div>
      <h1>Validate invoice and credit note documents</h1>
      <p>Upload a PDF, XML, or JSON file to check it against the UAE PINT-AE validation rules before submission.</p>
      <form id="upload-form">
        <label>
          File
          <input id="file-input" name="file" type="file" accept=".pdf,.xml,.json" required />
        </label>
        <label>
          ERP target
          <select id="erp-select" name="erp_type">
            <option value="sap">SAP</option>
            <option value="zoho">Zoho</option>
            <option value="netsuite">NetSuite</option>
          </select>
        </label>
        <button type="submit">Validate</button>
      </form>
      <div id="status" class="status">Waiting for input…</div>
    </main>

    <script>
      const form = document.getElementById("upload-form");
      const status = document.getElementById("status");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const fileInput = document.getElementById("file-input");
        const erpSelect = document.getElementById("erp-select");
        const file = fileInput.files[0];

        if (!file) {
          status.textContent = "Please choose a file first.";
          return;
        }

        status.textContent = "Sending request to the validation API…";

        const formData = new FormData();
        formData.append("file", file);
        formData.append("erp_type", erpSelect.value);

        try {
          const response = await fetch("/api/v1/validate", {
            method: "POST",
            body: formData,
          });

          const data = await response.json().catch(() => ({ detail: "No JSON response received." }));
          status.textContent = `HTTP ${response.status}\n\n${JSON.stringify(data, null, 2)}`;
        } catch (error) {
          status.textContent = `Request failed: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
